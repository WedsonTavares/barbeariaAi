openapi: 3.1.0
info:
  title: Barbearia AI - API do agente
  version: 0.2.0
  description: Ferramentas HTTP usadas pelo agente de IA para consultar serviços, criar leads e operar agendamentos.
servers:
  - url: https://{tenantHost}
    variables:
      tenantHost:
        default: barbearia-ai.exemplo.com
security:
  - AgentSecret: []
components:
  securitySchemes:
    AgentSecret:
      type: apiKey
      in: header
      name: x-barbearia-ai-secret
paths:
  /api/agent/info:
    post:
      summary: Informações da empresa
      responses:
        "200":
          description: Dados de atendimento, agenda, catálogo e profissionais.
  /api/agent/disponibilidade:
    post:
      summary: Consultar disponibilidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                startTime: { type: string, example: "14:00" }
                endTime: { type: string, example: "14:45" }
                slotMinutes: { type: integer, enum: [30] }
                serviceName: { type: string, example: Corte }
                professionalName: { type: string, example: Wedson }
      responses:
        "200":
          description: Slots ou profissionais disponíveis.
  /api/agent/agendar:
    post:
      summary: Criar agendamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, name, date, startTime, serviceNames]
              properties:
                phone: { type: string, example: "5516999999999" }
                name: { type: string, example: "João" }
                date: { type: string, format: date }
                startTime: { type: string, example: "14:00" }
                serviceNames:
                  type: array
                  items: { type: string }
                professionalName: { type: string }
                notes: { type: string }
      responses:
        "200":
          description: Agendamento criado ou chamada idempotente reconhecida.
        "409":
          description: Horário indisponível.
  /api/agent/meus-agendamentos:
    post:
      summary: Listar agendamentos ativos por telefone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        "200":
          description: Lista de agendamentos ativos.
  /api/agent/reagendar:
    post:
      summary: Reagendar atendimento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointmentId, phone, date, startTime]
              properties:
                appointmentId: { type: string, format: uuid }
                phone: { type: string }
                date: { type: string, format: date }
                startTime: { type: string, example: "15:00" }
                professionalName: { type: string }
      responses:
        "200":
          description: Agendamento remarcado.
  /api/agent/cancelar:
    post:
      summary: Cancelar atendimento confirmado pelo cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointmentId, phone, confirmed]
              properties:
                appointmentId: { type: string, format: uuid }
                phone: { type: string }
                confirmed: { type: boolean, const: true }
      responses:
        "200":
          description: Agendamento cancelado.
  /api/agent/cancelamento:
    post:
      summary: Registrar pedido de cancelamento para equipe
      responses:
        "200":
          description: Pedido anotado e atendimento humano acionado.
  /api/agent/lead:
    post:
      summary: Registrar lead
      responses:
        "200":
          description: Lead registrado.
